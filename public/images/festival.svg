    <rect x="128" y="98" width="5" height="5" rx="1" fill="#5FA8C4" transform="rotate(-15 130 100)"/>
    <rect x="92" y="108" width="5" height="5" rx="1" fill="#F2B441" transform="rotate(35 94 110)"/>
    <circle cx="156" cy="112" r="2.6" fill="#F5F2E8"/>
    <circle cx="34" cy="116" r="2.6" fill="#F2B441"/>
  </g>
  <!-- Fairground tents -->
  <rect x="0" y="150" width="200" height="50" fill="#34422E"/>
  <g>
    <path d="M40 150 L62 116 L84 150 Z" fill="#2C3A26"/>
    <path d="M84 150 L110 108 L136 150 Z" fill="#28351F"/>
    <path d="M132 150 L156 120 L180 150 Z" fill="#2C3A26"/>
    <!-- pennants -->
    <path d="M62 116 L62 106 L72 109 L62 112 Z" fill="#E0594C"/>
    <path d="M110 108 L110 96 L121 99.5 L110 103 Z" fill="#F2B441"/>
