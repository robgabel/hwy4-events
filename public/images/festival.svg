<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7E9170"/>
      <stop offset="100%" stop-color="#44543C"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- Festoon string 1 -->
  <path d="M0 30 Q100 58 200 30" fill="none" stroke="#EFE6D0" stroke-width="1.5" opacity="0.6"/>
  <g>
    <circle cx="20" cy="38" r="3.6" fill="#F2D98A"/>
    <circle cx="50" cy="46" r="3.6" fill="#EFC56A"/>
    <circle cx="80" cy="51" r="3.6" fill="#F2D98A"/>
    <circle cx="110" cy="51" r="3.6" fill="#EFC56A"/>
    <circle cx="140" cy="47" r="3.6" fill="#F2D98A"/>
    <circle cx="170" cy="39" r="3.6" fill="#EFC56A"/>
  </g>
  <!-- Festoon string 2 -->
  <path d="M0 60 Q100 84 200 60" fill="none" stroke="#EFE6D0" stroke-width="1.5" opacity="0.45"/>
  <g opacity="0.85">
    <circle cx="35" cy="69" r="3" fill="#F2D98A"/>
    <circle cx="100" cy="78" r="3" fill="#EFC56A"/>
    <circle cx="165" cy="69" r="3" fill="#F2D98A"/>
  </g>
  <!-- Confetti -->
  <g opacity="0.9">
