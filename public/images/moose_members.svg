<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3C4F63"/>
      <stop offset="100%" stop-color="#1F2B38"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- Moon -->
  <circle cx="150" cy="44" r="15" fill="#EAE3CC" opacity="0.9"/>
  <!-- Stars -->
  <g fill="#EAE3CC" opacity="0.7">
    <circle cx="40" cy="40" r="1.6"/>
    <circle cx="70" cy="28" r="1.2"/>
    <circle cx="118" cy="34" r="1.4"/>
    <circle cx="176" cy="78" r="1.2"/>
  </g>
  <!-- Back pines -->
  <path d="M20 150 L38 96 L56 150Z" fill="#23362B"/>
  <path d="M150 150 L170 92 L190 150Z" fill="#23362B"/>
  <!-- Ground -->
  <rect x="0" y="146" width="200" height="54" fill="#2A3A33"/>
  <!-- Cabin -->
  <path d="M56 116 L100 80 L144 116 Z" fill="#43301F"/>
  <path d="M62 113 L100 84 L138 113 Z" fill="#EAE3CC" opacity="0.22"/>
  <rect x="66" y="114" width="68" height="52" fill="#6B4A30"/>
  <g stroke="#583B25" stroke-width="2" opacity="0.55">
    <line x1="66" y1="127" x2="134" y2="127"/>
    <line x1="66" y1="141" x2="134" y2="141"/>
    <line x1="66" y1="155" x2="134" y2="155"/>
  </g>
  <rect x="116" y="86" width="10" height="22" fill="#43301F"/>
  <!-- Window glow -->
  <rect x="86" y="128" width="28" height="24" rx="1" fill="#F2C97A"/>
  <g stroke="#8A5A2E" stroke-width="2">
    <line x1="100" y1="128" x2="100" y2="152"/>
    <line x1="86" y1="140" x2="114" y2="140"/>
  </g>
  <!-- Chimney smoke -->
  <g fill="#EAE3CC" opacity="0.16">
    <ellipse cx="121" cy="80" rx="6" ry="4"/>
    <ellipse cx="124" cy="70" rx="5" ry="3.5"/>
  </g>
  <!-- Members lock badge -->
  <g>
    <circle cx="162" cy="160" r="17" fill="#EAE3CC"/>
    <path d="M156 159 v-4 a6 6 0 0 1 12 0 v4" fill="none" stroke="#43301F" stroke-width="3"/>
    <rect x="153" y="158" width="18" height="14" rx="2.5" fill="#43301F"/>
  </g>
</svg>
