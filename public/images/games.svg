<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E4F60"/>
      <stop offset="100%" stop-color="#2A3744"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- Pool 8-ball -->
  <circle cx="58" cy="118" r="30" fill="#23282E"/>
  <circle cx="58" cy="118" r="30" fill="none" stroke="#000000" stroke-width="1" opacity="0.4"/>
  <ellipse cx="49" cy="108" rx="8" ry="5" fill="#FFFFFF" opacity="0.18"/>
  <circle cx="58" cy="115" r="11" fill="#F5F2E8"/>
  <text x="58" y="121" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#23282E" text-anchor="middle">8</text>
  <!-- Die 1 -->
  <g transform="translate(118 70) rotate(-12)">
    <rect x="-24" y="-24" width="48" height="48" rx="9" fill="#F5F2E8"/>
    <rect x="-24" y="-24" width="48" height="48" rx="9" fill="none" stroke="#D8CFBE" stroke-width="1"/>
    <circle cx="-11" cy="-11" r="4.5" fill="#C4493C"/>
    <circle cx="11" cy="-11" r="4.5" fill="#3E4F60"/>
    <circle cx="0" cy="0" r="4.5" fill="#3E4F60"/>
    <circle cx="-11" cy="11" r="4.5" fill="#3E4F60"/>
    <circle cx="11" cy="11" r="4.5" fill="#C4493C"/>
  </g>
  <!-- Die 2 -->
  <g transform="translate(140 132) rotate(10)">
    <rect x="-19" y="-19" width="38" height="38" rx="7" fill="#E8C170"/>
    <rect x="-19" y="-19" width="38" height="38" rx="7" fill="none" stroke="#CDA856" stroke-width="1"/>
    <circle cx="-9" cy="-9" r="3.6" fill="#2A3744"/>
    <circle cx="9" cy="9" r="3.6" fill="#2A3744"/>
    <circle cx="0" cy="0" r="3.6" fill="#2A3744"/>
  </g>
  <!-- Bingo/ground line -->
  <line x1="20" y1="160" x2="180" y2="160" stroke="#8B9E7E" stroke-width="1" opacity="0.25"/>
  <!-- Faint pines -->
  <g opacity="0.15">
    <path d="M25 95 L35 65 L45 95Z" fill="#8B9E7E"/>
    <path d="M165 90 L176 58 L187 90Z" fill="#8B9E7E"/>
  </g>
</svg>
