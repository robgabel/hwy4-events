  <path d="M100 200 Q78 172 112 150 Q146 128 100 120" fill="none" stroke="#D8C9A8" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <path d="M100 200 Q78 172 112 150 Q146 128 100 120" fill="none" stroke="#EFE6D0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 8" opacity="0.7"/>
