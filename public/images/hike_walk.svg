    <path d="M35 152 L48 110 L61 152Z" fill="#2E4326"/>
    <path d="M38 160 L48 130 L58 160Z" fill="#37502D"/>
    <rect x="45" y="152" width="6" height="14" fill="#4A3826"/>
  </g>
  <g>
