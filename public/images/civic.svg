  <!-- Columns -->
  <g fill="#D8CFBE">
    <rect x="66" y="116" width="7" height="36"/>
    <rect x="84" y="116" width="7" height="36"/>
    <rect x="109" y="116" width="7" height="36"/>
    <rect x="127" y="116" width="7" height="36"/>
  </g>
  <!-- Door -->
