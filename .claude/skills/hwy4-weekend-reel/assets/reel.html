<style>
:root{
  --forest:#1b3a2d;--pine:#2d5a3d;--gold:#c4922a;--sunset:#d4855c;--cream:#fdf8f3;
  --bark:#4a3728;--earth:#6b4226;--sage:#8b9e7e;--sage-l:#b5c4a8;--sky:#5a8fa8;--stone:#6e6153;--wine:#8b2e2e;
  --page:#f5f0eb;--ink:#1b3a2d;--muted:#6e6153;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#10231b;--ink:#f5f0eb;--muted:#b5c4a8}}
:root[data-theme="dark"]{--page:#10231b;--ink:#f5f0eb;--muted:#b5c4a8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:"DM Sans",ui-sans-serif,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.player{width:min(100%,440px,calc((100dvh - 110px) * .5625))}
.frame{position:relative;width:100%;aspect-ratio:9/16;overflow:hidden;border-radius:12px;background:var(--forest)}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:var(--forest)}
.controls{display:flex;align-items:center;gap:12px;margin-top:12px}
.controls button{width:44px;height:44px;border-radius:50%;border:0;background:var(--gold);cursor:pointer;display:grid;place-items:center;flex:none}
.controls button:focus-visible,.controls input:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.controls input{flex:1;accent-color:var(--gold);height:28px;min-width:0}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px;min-width:84px;text-align:right}
.note{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
body.export{padding:0;display:block;background:var(--forest)}
body.export .player{width:1080px}
body.export .frame{border-radius:0;width:1080px;height:1920px}
body.export .controls,body.export .note{display:none}

.layer{position:absolute;inset:0;display:none;overflow:hidden}
.art{position:absolute;inset:0}
.content{position:absolute;left:70px;top:490px;width:940px}
.chip{display:inline-block;font-size:46px;font-weight:700;padding:12px 30px;border-radius:999px}
.title{display:inline-block;font-family:"Bitter",Georgia,serif;font-weight:800;line-height:.96;letter-spacing:-.02em;margin-top:26px}
.title .ln{display:block;white-space:nowrap;overflow:hidden;padding-bottom:.07em}
.title .ln>span{display:inline-block}
.support{font-family:"Bitter",Georgia,serif;font-weight:700;font-size:58px;margin-top:16px;line-height:1.1}
.detail{font-size:52px;font-weight:500;margin-top:14px;line-height:1.2}
.pillw{margin-top:24px}
.pill{display:inline-block;font-size:42px;font-weight:700;padding:11px 26px;border-radius:999px}
.picks{margin-top:56px;display:flex;flex-direction:column;gap:46px}
.pick{border-left:10px solid var(--gold);padding-left:32px}
.pick b{display:block;font-family:"Bitter",Georgia,serif;font-weight:700;font-size:70px;line-height:1.05}
.pick span{display:block;font-size:48px;margin-top:10px}
.dcontent{position:absolute;left:70px;top:660px;width:940px}
.big{display:inline-block;font-family:"Bitter",Georgia,serif;font-weight:800;line-height:.92;letter-spacing:-.03em}
.big .ln{display:block;white-space:nowrap}
.dsub{font-size:64px;font-weight:500;margin-top:18px}

.th-night{background:radial-gradient(ellipse at 50% 100%,#2a5540 0%,#1b3a2d 50%,#132a1f 100%);color:var(--cream)}
.th-night .chip{background:var(--gold);color:var(--forest)}
.th-night .support{color:var(--gold)}
.th-night .detail,.th-night .dsub,.th-night .pick span{color:var(--sage-l)}
.th-night .pill{background:var(--cream);color:var(--forest)}
.th-sunrise{background:linear-gradient(170deg,#dc9a68 0%,#d4855c 50%,#c9774f 100%);color:var(--forest)}
.th-sunrise .chip{background:var(--forest);color:var(--cream)}
.th-sunrise .title,.th-sunrise .big{color:var(--cream)}
.th-sunrise .pill{background:var(--cream);color:var(--forest)}
.th-trees{background:var(--pine);color:var(--cream)}
.th-trees .chip{background:var(--gold);color:var(--forest)}
.th-trees .support{color:var(--gold)}
.th-trees .detail,.th-trees .dsub,.th-trees .pick span{color:var(--sage-l)}
.th-trees .pill{background:var(--cream);color:var(--forest)}

#hdr{position:absolute;left:70px;top:300px;display:flex;align-items:center;gap:22px;padding:10px 36px 10px 10px;border-radius:999px;background:rgba(27,58,45,.9)}
#hdr .av{width:116px;height:116px;border-radius:50%;background:var(--cream);overflow:hidden;display:flex;justify-content:center;flex:none}
#hdr .av svg{width:98px;height:110px;margin-top:12px}
#hdr span{font-size:50px;font-weight:700;color:var(--cream)}

#end{background:var(--forest);color:var(--cream);text-align:center}
#endIn{position:absolute;inset:0}
#bigMillie{position:absolute;left:390px;top:380px;width:300px;height:338px;transform-origin:50% 100%}
#bigMillie svg{width:100%;height:100%}
#wordmark{position:absolute;left:0;right:0;top:770px;margin:0;font-family:"Bitter",Georgia,serif;font-weight:800;font-size:150px;line-height:1;letter-spacing:-.02em}
#wordmark span{display:inline-block;white-space:pre}
#endLine{position:absolute;left:0;right:0;top:1050px;font-size:52px;color:var(--sage-l)}
#url{position:absolute;left:0;right:0;top:1125px;font-size:86px;font-weight:700;color:var(--gold)}
#edge{position:absolute;left:0;right:0;height:22px;background:var(--gold);display:none}
</style>

<script>
const REEL=/*REEL_DATA*/{}/*END_REEL_DATA*/;
(function(){
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const ei=x=>x*x*x;
const eb=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const NS="http://www.w3.org/2000/svg";
const mk=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e};
const div=(cls,txt,parent)=>{const e=document.createElement('div');if(cls)e.className=cls;if(txt!=null)e.textContent=txt;parent&&parent.appendChild(e);return e};
let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const show=(el,on)=>{el.style.display=on?'block':'none'};
const fade=(el,p,dy=24)=>{if(!el)return; el.style.opacity=p; el.style.transform=`translateY(${(1-p)*dy}px)`};
const pop=(g,x,y,p,extra='')=>g.setAttribute('transform',`translate(${x} ${y}) scale(${Math.max(0,p)}) ${extra}`);
const C={forest:'#1b3a2d',pine:'#2d5a3d',gold:'#c4922a',sunset:'#d4855c',cream:'#fdf8f3',bark:'#4a3728',earth:'#6b4226',sage:'#8b9e7e',sageL:'#b5c4a8',sky:'#5a8fa8',wine:'#8b2e2e',lamp:'#f0c27a'};

/* ================= art library =================
   Each module: build(svg, s) draws into the scene's SVG; render(tau, s, t) animates it.
   tau = seconds since the scene started. Event art lives in the zone y 1200 to 1490.
   Theme backdrops (stars, sequoias) are added automatically by theme. */
const noteGlyph=(g,fill,beam)=>{
  mk('ellipse',{cx:0,cy:0,rx:17,ry:12,transform:'rotate(-22)',fill},g); mk('rect',{x:12,y:-74,width:6,height:74,fill},g);
  if(beam){mk('ellipse',{cx:44,cy:-8,rx:17,ry:12,transform:'rotate(-22 44 -8)',fill},g); mk('rect',{x:56,y:-82,width:6,height:74,fill},g); mk('rect',{x:12,y:-84,width:50,height:12,fill},g)}
  else mk('path',{d:'M18 -74 q24 10 18 38 q-4 -18 -18 -22 z',fill},g);
};
const ART={
  starsBg:{
    build(svg,s){s.stars=[...Array(80)].map(()=>({c:mk('circle',{cx:rnd()*1080,cy:rnd()*1900,r:1.2+rnd()*2.8,fill:C.cream},svg),ph:rnd()*6.28,sp:1.5+rnd()*3}))},
    render(tau,s,t){s.stars.forEach(st=>st.c.setAttribute('opacity',.2+.7*Math.abs(Math.sin(t*st.sp+st.ph))))}
  },
  sequoiasBg:{
    build(svg){[[-70,125,C.bark,1],[1000,170,C.earth,1],[40,40,C.earth,.5]].forEach(([x,w,c,o])=>{
      mk('rect',{x,y:-20,width:w,height:1980,fill:c,opacity:o},svg);
      for(let k=0;k<3;k++) mk('rect',{x:x+w*(.18+k*.28),y:-20,width:6,height:1980,fill:C.cream,opacity:.07*o},svg)})},
    render(){}
  },
  beams:{
    build(svg,s){const defs=mk('defs',{},svg), g=mk('linearGradient',{id:'beam'+s.i,x1:0,y1:1,x2:0,y2:0},defs);
      mk('stop',{offset:0,'stop-color':C.gold,'stop-opacity':.42},g); mk('stop',{offset:1,'stop-color':C.gold,'stop-opacity':0},g);
      s.beams=[250,540,830].map((x,k)=>({g:mk('polygon',{points:`${x},2150 ${x-240},-100 ${x+240},-100`,fill:`url(#beam${s.i})`},svg),x,k}))},
    render(tau,s,t){s.beams.forEach(b=>{b.g.setAttribute('transform',`rotate(${(b.k-1)*12+Math.sin(t*1.4+b.k*2)*12} ${b.x} 2150)`); b.g.setAttribute('opacity',s.first?1:eo(P(tau,.1,.7)))})}
  },
  sun:{
    build(svg,s){s.sunG=mk('g',{},svg); mk('circle',{r:420,fill:'#f3c98d',opacity:.35},s.sunG); mk('circle',{r:170,fill:C.lamp},s.sunG)},
    render(tau,s){s.sunG.setAttribute('transform',`translate(820 ${lerp(1950,1420,eo(P(tau,0,1.4)))})`)}
  },
  stomp:{ // grapes pop in, a boot stomps them (lands ~2.0s, on the beat), splash
    build(svg,s){
      const cx=540, top=1215, cols=[C.wine,'#7a2626','#9c3a3a'];
      s.puddle=mk('ellipse',{cx,cy:1482,rx:0,ry:0,fill:C.wine},svg);
      s.cluster=mk('g',{},svg);
      mk('path',{d:`M${cx} ${top-46} Q${cx+2} ${top-78} ${cx+18} ${top-98}`,stroke:C.bark,'stroke-width':12,fill:'none','stroke-linecap':'round'},s.cluster);
      s.leaf=mk('path',{d:`M${cx+12} ${top-74} Q${cx+66} ${top-130} ${cx+146} ${top-98} Q${cx+100} ${top-40} ${cx+12} ${top-74} Z`,fill:C.pine},s.cluster);
      s.grapes=[];
      [5,4,3,2,1].forEach((n,row)=>{for(let k=0;k<n;k++){const g=mk('g',{},s.cluster);
        mk('circle',{cx:0,cy:0,r:34,fill:cols[(row+k)%3]},g); mk('circle',{cx:-11,cy:-12,r:8,fill:C.cream,opacity:.35},g);
        s.grapes.push({g,x:cx+(k-(n-1)/2)*68,y:top+row*58,i:s.grapes.length})}});
      s.splats=[...Array(18)].map(()=>{const a=(-170+rnd()*160)*Math.PI/180,v=560+rnd()*560;return {c:mk('circle',{r:8+rnd()*13,fill:C.wine},svg),vx:Math.cos(a)*v,vy:Math.sin(a)*v}});
      s.boot=mk('g',{},svg);
      mk('path',{d:'M-56 -370 L56 -370 L56 -78 L134 -62 Q170 -52 170 -18 L170 0 L-68 0 Q-70 -50 -56 -80 Z',fill:C.bark},s.boot);
      mk('rect',{x:-70,y:-16,width:242,height:16,rx:4,fill:'#2e2219'},s.boot);
    },
    render(tau,s){
      s.grapes.forEach(g=>pop(g.g,g.x,g.y,s.first?1:eb(P(tau,.45+g.i*.04,.8+g.i*.04))));
      s.leaf.setAttribute('opacity',s.first?1:P(tau,.4,.6));
      let by; if(tau<1.7) by=-900; else if(tau<1.93) by=lerp(-500,1180,ei(P(tau,1.7,1.93))); else if(tau<2.07) by=lerp(1180,1470,P(tau,1.93,2.07)); else if(tau<2.2) by=1470; else by=lerp(1470,-700,ei(P(tau,2.2,2.6)));
      s.boot.setAttribute('transform',`translate(480 ${by})`);
      const q=P(tau,1.93,2.07);
      s.cluster.setAttribute('transform',`translate(540 1490) scale(${1+q*.35} ${1-q*.85}) translate(-540 -1490)`);
      s.cluster.setAttribute('opacity',1-P(tau,2.05,2.15));
      const pd=eo(P(tau,2.0,2.25)); s.puddle.setAttribute('rx',pd*230); s.puddle.setAttribute('ry',pd*40);
      const st=tau-2.0; s.splats.forEach(sp=>{if(st<0){sp.c.setAttribute('opacity',0);return}
        sp.c.setAttribute('cx',540+sp.vx*st); sp.c.setAttribute('cy',1480+sp.vy*st+950*st*st); sp.c.setAttribute('opacity',1-P(st,0,.9))});
    }
  },
  blend:{ // three wines drip into one glass
    build(svg,s){
      const defs=mk('defs',{},svg), cp=mk('clipPath',{id:'bowl'+s.i},defs);
      const bowl='M430 1250 L650 1250 Q656 1405 540 1410 Q424 1405 430 1250 Z';
      mk('path',{d:bowl},cp);
      s.fill=mk('rect',{x:420,y:1410,width:240,height:0,fill:'#9a3b3a','clip-path':`url(#bowl${s.i})`},svg);

stage.setAttribute('aria-label',REEL.aria||"Millie's weekend picks on Hwy 4");
let acc=0;
const scenes=REEL.scenes.map((d,i)=>{const layout=d.layout||'event'; const s={d,i,layout,theme:d.theme||'night',start:acc,dur:d.dur||DEF_DUR[layout]||4,first:i===0}; acc+=s.dur; return s});
scenes.forEach((s,i)=>{ if(i===0){s.enter='none';return} const p=scenes[i-1]; s.enter=(s.layout!=='event'||s.theme!==p.theme)?'theme':'slide' });
const END0=acc, ENDD=(REEL.end&&REEL.end.dur)||4, T=END0+ENDD;

scenes.forEach(s=>{
  const d=s.d, el=div('layer th-'+s.theme); stage.insertBefore(el,trunksSvg); s.el=el;
  const svg=mk('svg',{class:'art',viewBox:'0 0 1080 1920',width:1080,height:1920},el);
  s.bg=ART[THEME_BG[s.theme]]; if(s.bg) s.bg.build(svg,s);
  s.art=d.art?ART[d.art]:null; if(s.art) s.art.build(svg,s);
  if(s.layout==='divider'){
    const c=div('dcontent',null,el); s.big=div('big',null,c); s.fitEl=s.big;
    s.lines=[d.big||d.day].map(tx=>{const ln=div('ln',null,s.big); const sp=document.createElement('span'); sp.textContent=tx; ln.appendChild(sp); return sp});
    if(d.sub) s.sub=div('dsub',d.sub,c);
    return;
  }
  const c=div('content',null,el);
  if(d.chip) s.chip=div('chip',d.chip,div('',null,c));
  s.title=div('title',null,c); s.fitEl=s.title;
  s.lines=(d.title||[]).map(tx=>{const ln=div('ln',null,s.title); const sp=document.createElement('span'); sp.textContent=tx; ln.appendChild(sp); return sp});
  if(d.support) s.support=div('support',d.support,c);
  if(d.detail) s.detail=div('detail',d.detail,c);
  if(d.pill){ const w=div('pillw',null,c); s.pill=div('pill',d.pill,w) }
  if(d.items){ const pk=div('picks',null,c); s.items=d.items.map(p=>{const e=div('pick',null,pk); const b=document.createElement('b'); b.textContent=p.what; e.appendChild(b); const sp=document.createElement('span'); sp.textContent=p.where; e.appendChild(sp); return e}) }
});
function fitTitles(){ // shrink each title until its widest line fits the text column
  scenes.forEach(s=>{const prev=s.el.style.display; s.el.style.display='block';
    let size=s.d.title_size||(s.layout==='divider'?330:DEF_TITLE[s.layout]||160); s.fitEl.style.fontSize=size+'px';
    const w=()=>Math.max(0,...s.lines.map(sp=>sp.offsetWidth));
    while(w()>930&&size>70){size-=4; s.fitEl.style.fontSize=size+'px'}
    s.el.style.display=prev});
}

/* trunk sweep used when entering a 'trees' themed scene from another theme */
const TRUNKS=[]; {let x=-20,i=0; const cols=[C.earth,C.bark,'#7a4b2c','#5a3b27'];
  while(x<1100){const w=150+rnd()*80, g=mk('g',{},trunksSvg); mk('rect',{x,y:0,width:w+20,height:2300,fill:cols[i%4]},g);
    for(let k=0;k<3;k++) mk('rect',{x:x+w*(.2+k*.27),y:0,width:7,height:2300,fill:C.cream,opacity:.07},g);
    TRUNKS.push({g,i}); x+=w; i++}}

/* end card */
const END=REEL.end||{};
const wSpans=[...(END.wordmark||'Hwy 4 Events')].map(ch=>{const s=document.createElement('span');s.textContent=ch;$('wordmark').appendChild(s);return s});
$('endLine').textContent=END.line||'Everything this weekend at'; $('url').textContent=END.url||'hwy4events.com';
const sq=$('sq'), sqL=sq.getTotalLength(); sq.setAttribute('stroke-dasharray',sqL+' '+sqL);
const hops=[[-80,960]].concat([0,.2,.4,.6,.8,1].map(f=>{const p=sq.getPointAtLength(f*sqL);return [p.x+140,p.y+930]})).concat([[1180,950]]);
const FROG0=1.9, HOP=.2;

/* ================= render(t) ================= */
function renderScene(s,t){
  const tau=t-s.start, next=scenes[s.i+1];
  const vFrom=s.first?-1:s.start-(s.enter==='theme'&&s.theme==='trees'?.1:.3);
  const vTo=s.start+s.dur+(next&&next.theme==='trees'&&next.enter==='theme'?.05:.35);
  const vis=t>=vFrom&&t<vTo; show(s.el,vis); if(!vis) return;
  let tx=0; s.el.style.clipPath='none';
  if(s.enter==='theme'&&s.theme!=='trees'){const r=lerp(0,2400,eio(P(tau,-.3,.2))); const cy=s.theme==='night'?-200:2150;
    if(r<2390) s.el.style.clipPath=`circle(${r}px at 540px ${cy}px)`}
  if(s.enter==='slide') tx=(1-eio(P(tau,-.3,.15)))*1080;
  if(next&&next.enter==='slide') tx-=eio(P(t,next.start-.3,next.start+.15))*360;
  s.el.style.transform=tx?`translateX(${tx}px)`:'';
  if(s.bg) s.bg.render(tau,s,t);
  if(s.art) s.art.render(tau,s,t);
  const E=(a,dur=.45)=>s.first?1:eo(P(tau,a,a+dur));
  if(s.layout==='divider'){
    const h=eo(P(tau,0,.3)); s.big.style.opacity=P(tau,0,.08); s.big.style.transformOrigin='0 60%'; s.big.style.transform=`scale(${lerp(1.35,1,h)})`;
    fade(s.sub,E(.25),20); return;
  }
  fade(s.chip,E(.12),20);
  s.lines.forEach((ln,k)=>{const p=s.first?1:eo(P(tau,.22+k*.1,.72+k*.1)); ln.style.transform=`translateY(${(1-p)*105}%)`});
  fade(s.support,E(.5),20); fade(s.detail,E(.65),20);
  if(s.pill){const p=s.first?1:eb(P(tau,.85,1.15)); s.pill.style.transform=`scale(${Math.max(0,p)})`; s.pill.style.opacity=s.first?1:P(tau,.85,.95)}
  if(s.items) s.items.forEach((e,k)=>{const p=eo(P(tau,.8+k*.55,1.3+k*.55)); e.style.opacity=p; e.style.transform=`translateX(${(1-p)*-60}px)`});
}
function render(t){
  scenes.forEach(s=>renderScene(s,t));
  const ts=scenes.find(s=>s.theme==='trees'&&s.enter==='theme'&&t>=s.start-.65&&t<s.start+.7);
  show(trunksSvg,!!ts);
  if(ts) TRUNKS.forEach(k=>{const d=(k.i%5)*.035+(k.i%2)*.02; let y;
    if(t<ts.start-.02) y=lerp(1960,-160,eo(P(t,ts.start-.6+d,ts.start-.2+d))); else y=lerp(-160,-2400,ei(P(t,ts.start+.02+d,ts.start+.5+d)));
    k.g.setAttribute('transform',`translate(0 ${y})`)});
  $('hdr').style.display=t<END0+.5?'flex':'none';
  const end=$('end'), edge=$('edge'), te=t-END0;
  const w=eio(P(te,-.2,.3)), Y=lerp(1920,0,w);
  show(end,te>=-.2); edge.style.display=te>=-.2&&w<1?'block':'none'; edge.style.top=(Y-22)+'px';
  if(te>=-.2){
    end.style.clipPath=`inset(${Y}px 0 0 0)`;
    const m=eb(P(te,.15,.6)); $('bigMillie').style.transform=`scale(${Math.max(0,m)}) rotate(${Math.sin(te*6)*2*P(te,.6,1)}deg)`;
    wSpans.forEach((s,i)=>{const p=eo(P(te,.35+i*.035,.8+i*.035)); s.style.opacity=p; s.style.transform=`translateY(${(1-p)*70}px)`});
    sq.setAttribute('stroke-dashoffset',sqL*(1-eio(P(te,.75,1.3))));
    fade($('endLine'),eo(P(te,.95,1.4)),20); fade($('url'),eo(P(te,1.1,1.55)),20);
    let fx=-200,fy=960,air=0;
    if(te>=FROG0){const k=Math.min(hops.length-2,Math.floor((te-FROG0)/HOP)); const p=eio(P(te,FROG0+k*HOP,FROG0+(k+1)*HOP));
      const a=hops[k],b=hops[k+1]; fx=lerp(a[0],b[0],p); fy=lerp(a[1],b[1],p)-Math.sin(Math.PI*p)*90; air=Math.sin(Math.PI*p)}
    $('frog').setAttribute('transform',`translate(${fx} ${fy})`);
    $('frogInner').setAttribute('transform',`scale(${1.7*(1-air*.12)} ${1.7*(1+air*.18)})`);
    $('endIn').style.opacity=1-P(te,ENDD-.3,ENDD);
  }
}

/* ================= playback / export hooks ================= */
const frame=$('frame'), isExport=/export/.test(location.search);
let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches, t0=performance.now(), cur=playing?0:(REEL.thumb_time||3);
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
$('scrub').max=Math.round(T*1000);
function setT(t){cur=t; render(t); $('scrub').value=Math.round(t*1000); $('time').textContent=fmt(t)+' / '+fmt(T)}
function icon(){$('ppi').innerHTML=playing?'<rect x="3" y="2" width="4" height="14" rx="1"/><rect x="11" y="2" width="4" height="14" rx="1"/>':'<path d="M4 2 L16 9 L4 16 Z"/>'; $('pp').setAttribute('aria-label',playing?'Pause':'Play')}
function loop(now){ if(playing) setT(((now-t0)/1000)%T); requestAnimationFrame(loop) }
function fit(){ stage.style.transform=`scale(${frame.clientWidth/1080})` }
window.__duration=T;
window.__scenes=scenes.map(s=>({start:s.start,dur:s.dur,theme:s.theme,layout:s.layout,art:s.d.art||null,enter:s.enter}));
window.__end={start:END0,dur:ENDD,frog_start:FROG0,hop:HOP,hops:hops.length-1};
window.__qaTimes=[0].concat(scenes.map(s=>s.start+Math.min(2.6,s.dur-.3))).concat([END0+1.8]);
const fontsIn=Promise.all(['800 100px Bitter','700 100px Bitter','500 50px "DM Sans"','700 50px "DM Sans"'].map(f=>document.fonts.load(f).catch(()=>{}))).then(()=>document.fonts.ready);
if(isExport){
  document.body.classList.add('export');
  window.__seek=t=>render(t);
  fontsIn.then(()=>{fitTitles(); render(0); window.__ready=true});
}else{
  new ResizeObserver(fit).observe(frame); fit(); icon();
  $('pp').onclick=()=>{playing=!playing; if(playing) t0=performance.now()-cur*1000; icon()};
  $('scrub').oninput=e=>{playing=false; icon(); setT(e.target.value/1000)};
  fontsIn.then(()=>{fitTitles(); t0=performance.now()-cur*1000; setT(cur); requestAnimationFrame(loop)});
}
})();
</script>
</body>
</html>
