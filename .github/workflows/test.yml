name: Tests

# Gate the dedup "same event" rule (and any future tests) on every change to
# the shared identity logic or the scraper scripts. The rule lives in exactly
# one place (lib/event-identity.ts); this keeps the read-time and write-time
# callers from ever drifting apart again.

on:
  pull_request:
    paths:
      - 'app/**'
      - 'content/**'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/test.yml'
  workflow_dispatch: # Manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Run tests
        run: npm test
        working-directory: scripts

      # Voice lint: hard-fails on BANNED_PHRASE / HUMANITY_CLAIM / LEAK in the
      # shipped town pages, FAQ, and About; prints warnings for the rest. The
      # same hard-fail gate also runs inside `npm test` (voice-lint.test.ts).
      - name: Voice lint (content/VOICE.md)
        run: npx tsx voice-lint.ts --warn
        working-directory: scripts
