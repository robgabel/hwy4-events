name: Tests

# Gate the dedup "same event" rule (and any future tests) on every change to
# the shared identity logic or the scraper scripts. The rule lives in exactly
# one place (lib/event-identity.ts); this keeps the read-time and write-time
# callers from ever drifting apart again.

on:
  pull_request:
    paths:
      - 'app/**'
      - 'content/**'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/test.yml'
  workflow_dispatch: # Manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The scripts tests import root lib/ modules (e.g. lib/events.ts, whose
      # pickFallbackEvent is locked by events-fallback.test.ts). Some of those
      # modules import app deps like react (`import { cache } from "react"`),
      # resolved from the repo-root node_modules — so install root deps too, not
      # just scripts/. Without this CI fails with "Cannot find module 'react'"
      # (it only passed locally because the worktree is nested inside the app's
      # node_modules, where react already resolves).
      - name: Install root dependencies
        run: npm install

      - name: Install scripts dependencies
        run: npm install
        working-directory: scripts

      - name: Run tests
        run: npm test
        working-directory: scripts

      # Voice lint: hard-fails on BANNED_PHRASE / HUMANITY_CLAIM / LEAK in the
      # shipped town pages, FAQ, and About; prints warnings for the rest. The
      # same hard-fail gate also runs inside `npm test` (voice-lint.test.ts).
      - name: Voice lint (content/VOICE.md)
        run: npx tsx voice-lint.ts --warn
        working-directory: scripts
