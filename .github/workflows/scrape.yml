name: Daily Event Scrape

on:
  schedule:
    - cron: '0 8 * * *' # 8 AM UTC (midnight PST)
  workflow_dispatch: # Manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 10m was too tight: GoCalaveras alone can eat ~9m (worsened by LLM JSON
    # retries), starving the scrapers that run after it — Mystic Saloon (FB),
    # FB Discover, Visit Murphys, Red Cross — so the job was cancelled every day
    # before they ran. Give the tail room; a healthy run still finishes early.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Run scrapers
        id: scrape
        run: npx tsx scrape.ts
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}

      - name: Sanity-check event locations
        id: sanity
        run: npx tsx sanity-check-locations.ts
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Fire on failure() OR cancelled(). A job timeout is reported as
      # `cancelled`, NOT `failure`, so the old `if: failure()` silently swallowed
      # every timeout — which is exactly how the daily scrape went 40 days
      # cancelled-at-10m with no alert. cancelled()/always() steps still run
      # during a cancellation, so this issue gets created on a timeout too.
      # NOTE: the status functions (cancelled(), failure()) are only valid in an
      # `if:`; they cannot appear in a ${{ }} expression elsewhere (e.g. inside
      # this script). So we detect a timeout from the step OUTCOMES instead, which
      # ARE valid in ${{ }}: a timeout cancels whichever step was running.
      - name: Report scrape failure or timeout
        if: failure() || cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const scrapeOutcome = '${{ steps.scrape.outcome }}';
            const sanityOutcome = '${{ steps.sanity.outcome }}';
            const wasCancelled = scrapeOutcome === 'cancelled' || sanityOutcome === 'cancelled';
            const sanityFailed = sanityOutcome === 'failure';
            const label = wasCancelled
              ? 'Scrape cancelled (likely the job timeout)'
              : sanityFailed ? 'Location sanity check failed' : 'Scrape failed';
            const detail = wasCancelled
              ? 'The daily scrape job was cancelled before finishing — almost always the job timeout. GoCalaveras can consume most of the time budget, so the scrapers after it (Mystic Saloon/Facebook, FB Discover, Visit Murphys, Red Cross) may not have run. Check the logs for the last source that started.'
              : `The daily ${sanityFailed ? 'location sanity check' : 'scrape'} step failed on ${today}.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${label}: ${today}`,
              body: `${detail}\n\n[View run logs](${runUrl})`,
              labels: ['bug', 'automated'],
            });
