name: Daily Event Scrape

on:
  schedule:
    - cron: '0 8 * * *' # 8 AM UTC (midnight PST)
  workflow_dispatch: # Manual trigger

# Checkout only. Failure notices are agent_actions rows written with the
# service-role key (issue #345), not GitHub issues, so this token stays read-only.
permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      scrape_outcome: ${{ steps.scrape.outcome }}
      sanity_outcome: ${{ steps.sanity.outcome }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Run scrapers
        id: scrape
        run: npx tsx scrape.ts
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          # Lets scripts/lib/scrape-run-log.ts post a loud-fail alert if the
          # scrape_runs telemetry insert itself fails (HWY-18) — optional,
          # same secret the Vercel routes use for their own Slack posts.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Stale sweeps (scripts/lib/stale-sweep-exec.ts) run report-only until
          # this REPOSITORY VARIABLE (not a Vercel env, not a secret) NAMES the
          # source — Settings → Secrets and variables → Actions → Variables.
          # It is a comma-separated list of org slugs and nothing else
          # ("murphys-irish-pub,sequoia-woods"): there is deliberately no
          # "true"/all value, so arming one sweep can never arm the
          # corridor-wide gocalaveras one by accident. Unset or unrecognized
          # ⇒ every sweep dry-runs.
          SWEEP_EXECUTE: ${{ vars.SWEEP_EXECUTE }}

      - name: Sanity-check event locations
        id: sanity
        run: npx tsx sanity-check-locations.ts
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # A thrown source stays inside scrape.ts (exit 0) and files its own row.
  # This job is the path that still runs when the scrape job is failure or
  # cancelled: if: failure() never runs for a timeout-minutes kill.
  alert:
    needs: scrape
    if: ${{ always() && needs.scrape.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: File scrape job alert
        run: npx tsx file-scrape-job-alert.ts
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_JOB_RESULT: ${{ needs.scrape.result }}
          SCRAPE_STEP_OUTCOME: ${{ needs.scrape.outputs.scrape_outcome }}
          SANITY_STEP_OUTCOME: ${{ needs.scrape.outputs.sanity_outcome }}
