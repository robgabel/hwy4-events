name: Daily Event Scrape

on:
  schedule:
    - cron: '0 8 * * *' # 8 AM UTC (midnight PST)
  workflow_dispatch: # Manual trigger

# The failure path files a GitHub issue via actions/github-script; the default
# GITHUB_TOKEN is read-only, so without an explicit grant that step 403s
# ("Resource not accessible by integration") and the failure alert never lands —
# which is how two red sanity-check runs (2026-08-17/18) went unannounced. A
# sensor that can fail silently is not a sensor (HWY-18).
permissions:
  contents: read
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Run scrapers
        id: scrape
        run: npx tsx scrape.ts
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          # Lets scripts/lib/scrape-run-log.ts post a loud-fail alert if the
          # scrape_runs telemetry insert itself fails (HWY-18) — optional,
          # same secret the Vercel routes use for their own Slack posts.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Stale sweeps (scripts/lib/stale-sweep-exec.ts) run report-only until
          # this REPOSITORY VARIABLE (not a Vercel env, not a secret) NAMES the
          # source — Settings → Secrets and variables → Actions → Variables.
          # It is a comma-separated list of org slugs and nothing else
          # ("murphys-irish-pub,sequoia-woods"): there is deliberately no
          # "true"/all value, so arming one sweep can never arm the
          # corridor-wide gocalaveras one by accident. Unset or unrecognized
          # ⇒ every sweep dry-runs.
          SWEEP_EXECUTE: ${{ vars.SWEEP_EXECUTE }}

      - name: Sanity-check event locations
        id: sanity
        run: npx tsx sanity-check-locations.ts
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Create failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failedStep = '${{ steps.sanity.outcome }}' === 'failure'
              ? 'Location sanity check'
              : 'Scrape';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${failedStep} failed: ${today}`,
              body: `The daily ${failedStep.toLowerCase()} step failed on ${today}.\n\n[View run logs](${runUrl})`,
              labels: ['bug', 'automated']
            });
